services:
  api:
    build: .
    image: oficios-rpz-app
    container_name: api
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:?defina MYSQL_USER no .env}:${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}@db:3306/${MYSQL_DATABASE:-oficios_rpz}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      API_KEY: ${API_KEY:-}
      # Legado: a caixa de abuse agora fica em Geral > Parâmetros. Se ainda estiver no .env,
      # é importada uma única vez no primeiro start e depois ignorada.
      ABUSE_IMAP_HOST: ${ABUSE_IMAP_HOST:-}
      ABUSE_IMAP_PORT: ${ABUSE_IMAP_PORT:-}
      ABUSE_IMAP_USER: ${ABUSE_IMAP_USER:-}
      ABUSE_IMAP_PASSWORD: ${ABUSE_IMAP_PASSWORD:-}
      ABUSE_IMAP_MAILBOX: ${ABUSE_IMAP_MAILBOX:-}
      ABUSE_IMAP_CA_FILE: ${ABUSE_IMAP_CA_FILE:-}
      ABUSE_IMAP_TIMEOUT_SECONDS: ${ABUSE_IMAP_TIMEOUT_SECONDS:-60}
      WHOIS_LOOKUP_TIMEOUT_SECONDS: ${WHOIS_LOOKUP_TIMEOUT_SECONDS:-8}
      # Legado (até a 1.3.2): BIND e roteadores agora ficam em Geral > Parâmetros. Se ainda
      # estiverem no .env, são importados uma única vez no primeiro start e depois ignorados.
      SSH_HOST: ${SSH_HOST:-}
      SSH_PORT: ${SSH_PORT:-}
      SSH_USER: ${SSH_USER:-}
      SSH_PASSWORD: ${SSH_PASSWORD:-}
      SSH_KEY_PATH: ${SSH_KEY_PATH:-}
      SSH_KEY_PASSPHRASE: ${SSH_KEY_PASSPHRASE:-}
      SSH_STRICT_HOST_KEY_CHECKING: ${SSH_STRICT_HOST_KEY_CHECKING:-}
      SUDO_PASSWORD: ${SUDO_PASSWORD:-}
      ROUTER_SSH_HOST: ${ROUTER_SSH_HOST:-}
      ROUTER_SSH_PORT: ${ROUTER_SSH_PORT:-}
      ROUTER_SSH_USER: ${ROUTER_SSH_USER:-}
      ROUTER_SSH_PASSWORD: ${ROUTER_SSH_PASSWORD:-}
      ROUTER_SSH_KEY_PATH: ${ROUTER_SSH_KEY_PATH:-}
      ROUTER_SSH_KEY_PASSPHRASE: ${ROUTER_SSH_KEY_PASSPHRASE:-}
      RPZ_REMOTE_PATH: ${RPZ_REMOTE_PATH:-}
      RPZ_RELOAD_COMMAND: ${RPZ_RELOAD_COMMAND:-}
      RPZ_TEST_RESOLVER: ${RPZ_TEST_RESOLVER:-}
      RPZ_NAMESERVER: ${RPZ_NAMESERVER:-}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-America/Sao_Paulo}
    expose:
      - "8000"
    volumes:
      - ${HOST_UPLOAD_PATH:-./uploads}:/app/uploads
      - ${HOST_SSH_KEY_PATH:-./ssh/id_rsa}:/run/secrets/bind_ssh_key:ro
      - ${HOST_SSH_KNOWN_HOSTS_PATH:-./ssh/known_hosts}:/root/.ssh/known_hosts:ro
    depends_on:
      db:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - "80"
    networks:
      default:
      npm_proxy:
        aliases:
          - ${NPM_FRONTEND_ALIAS:-oficios-frontend}
    depends_on:
      api:
        condition: service_started

  whois-worker:
    build: .
    image: oficios-rpz-app
    container_name: whois-worker
    command: python -m app.whois_worker
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:?defina MYSQL_USER no .env}:${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}@db:3306/${MYSQL_DATABASE:-oficios_rpz}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      WHOIS_LOOKUP_TIMEOUT_SECONDS: ${WHOIS_LOOKUP_TIMEOUT_SECONDS:-8}
      WHOIS_WORKER_INTERVAL_SECONDS: ${WHOIS_WORKER_INTERVAL_SECONDS:-5}
      WHOIS_WORKER_MAX_ATTEMPTS: ${WHOIS_WORKER_MAX_ATTEMPTS:-3}
    depends_on:
      db:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  abuse-worker:
    build: .
    image: oficios-rpz-app
    container_name: abuse-worker
    command: python -m app.abuse_worker
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:?defina MYSQL_USER no .env}:${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}@db:3306/${MYSQL_DATABASE:-oficios_rpz}
      ABUSE_IMAP_CA_FILE: ${ABUSE_IMAP_CA_FILE:-}
      ABUSE_IMAP_TIMEOUT_SECONDS: ${ABUSE_IMAP_TIMEOUT_SECONDS:-60}
      ABUSE_POLL_INTERVAL_SECONDS: ${ABUSE_POLL_INTERVAL_SECONDS:-600}
      ABUSE_MAX_MESSAGE_MB: ${ABUSE_MAX_MESSAGE_MB:-25}
      ABUSE_SESSION_RESOLVER: ${ABUSE_SESSION_RESOLVER:-manual}
    volumes:
      - ${HOST_UPLOAD_PATH:-./uploads}:/app/uploads
    depends_on:
      db:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  backup-worker:
    build: .
    image: oficios-rpz-app
    container_name: backup-worker
    command: python -m app.backup_worker
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:?defina MYSQL_USER no .env}:${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}@db:3306/${MYSQL_DATABASE:-oficios_rpz}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-America/Sao_Paulo}
      BACKUP_WORKER_INTERVAL_SECONDS: ${BACKUP_WORKER_INTERVAL_SECONDS:-30}
      DB_BACKUP_TIMEOUT_SECONDS: ${DB_BACKUP_TIMEOUT_SECONDS:-300}
    volumes:
      - ${HOST_UPLOAD_PATH:-./uploads}:/app/uploads:ro
    depends_on:
      db:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.4.9
    container_name: db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oficios_rpz}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    external: true
    name: oficios-rpz_mysql_data

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK_NAME:-nginx-proxy-manager_default}
